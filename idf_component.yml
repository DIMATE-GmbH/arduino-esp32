description: "Arduino core adjusted for ESP32 / Pico32 SoC"
url: "https://github.com/DIMATE-GmbH/arduino-esp32"
license: "LGPL-2.1"
targets:
  - esp32
tags:
  - arduino
files:
  include:
    - "variants/pico32/**/*"
  exclude:
    - ".*" # All files in the root directory that start with a dot.
    - ".gitlab/"
    - ".gitlab/**/*"
    - "docs/"
    - "docs/**/*"
    - "idf_component_examples/"
    - "idf_component_examples/**/*"
    - "package/"
    - "package/**/*"
    - "tests/"
    - "tests/**/*"
    - "tools/"
    - "tools/**/*"
    - "variants/**/*"
    - "boards.txt"
    - "CODE_OF_CONDUCT.md"
    - "LICENSE.md"
    - "package.json"
    - "platform.txt"
    - "programmers.txt"
    - "esp32-core-3.3.7.2/"
    - "esp32-core-3.3.7.2/**/*"
    - "esp32-core-3.3.7.2.zip"
dependencies:
  idf: ">=5.3,<5.6"
